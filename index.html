.bg-animation{
    position:fixed;

    top:0;

.circle{

.circle:nth-child(1){

    font-weight:900;
    background:linear-gradient(90deg,#00ffff,#00aaff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 10px #00ffff);
    }
    to{

.contact a:hover{

.info{

.footer{
