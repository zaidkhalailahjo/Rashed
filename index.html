<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النطاق hbtf.ai للبيع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(197,100%,48%,0.15) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
            padding: 20px;
        }

        /* تأثير الخلفية المتحركة */
        .bg-animation {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--secondary-color);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: move 10s infinite alternate;
            z-index: -1;
        }

        @keyframes move {
            0% { transform: translate(-100px, -100px); }
            100% { transform: translate(100px, 100px); }
        }

        /* تصميم البطاقة الزجاجية */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            letter-spacing: 1px;
        }

        .domain-name {
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            direction: ltr;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .description {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* قسم السعر */
        .price-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .price-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 16px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .price-box:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .price-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
        }

        .price-currency {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* قسم التواصل */
        .contact-info {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: right;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            font-size: 1.2rem;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: #fff;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
            width: 100%;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0, 242, 254, 0.4);
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            .price-container { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="card">
        <div class="status">● متاح للبيع</div>
        
        <h1 class="domain-name">hbtf.ai</h1>
        <p class="description">استثمر في المستقبل مع هذا النطاق المميز والفريد.</p>

        <div class="price-container">
            <div class="price-box">
                <div class="price-amount">10,000</div>
                <div class="price-currency">دينار أردني (JOD)</div>
            </div>
            <div class="price-box">
                <div class="price-amount">14,100</div>
                <div class="price-currency">دولار أمريكي (USD)</div>
            </div>
        </div>

        <div class="contact-info">
            <div class="info-item">
                <div class="info-icon">📍</div>
                <div>
                    <div class="price-currency">الدولة</div>
                    <div>الأردن</div>
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">📞</div>
                <div>
                    <div class="price-currency">رقم الهاتف</div>
                    <div dir="ltr">079 092 6407</div>
                </div>
            </div>
        </div>

        <a href="https://wa.me/962790926407" class="cta-btn" target="_blank">
            تواصل الآن عبر واتساب
        </a>
    </div>

</body>
</html>
