<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hbtf.ai | للبيع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a26;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #10b981;
            --text: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            /* خلفية متدرجة ثابتة بدون حركة ثقيلة لمنع التعليق */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 20px;
            overflow-x: hidden;
        }

        /* أنميشن ظهور الكرت الرئيسي بسلاسة */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* إشارة متوهجة تنبض (Pulse Animation) */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            position: relative;
        }

        .badge-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* اسم الدومين مع أنميشن توهج خفيف وسلس */
        .domain {
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            direction: ltr;
            display: inline-block;
            letter-spacing: -1px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 0px rgba(0,242,254,0); }
            to { text-shadow: 0 0 20px rgba(0, 242, 254, 0.2); }
        }

        .subtext {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* حاوية الأسعار وتأثيرات الحركية عند تمرير الماوس */
        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .price-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .price-card:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.05);
        }

        .price-val {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .price-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* تفاصيل البيانات الشخصية */
        .details-list {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 35px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-row:first-child {
            padding-top: 0;
        }

        .detail-lbl {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .detail-val {
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* زر التواصل الأكشن وتأثيره الحركي السلس الحجم المتغير */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #0b0f19;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.2);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.4);
            filter: brightness(1.1);
        }

        .btn-whatsapp:active {
            transform: translateY(1px);
        }

        .btn-whatsapp svg {
            width: 24px;
            height: 24px;
            fill: #0b0f19;
        }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            .price-grid { grid-template-columns: 1fr; gap: 12px; }
            .domain { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            <span>هذا النطاق متاح للشراء الفوري</span>
        </div>
        
        <h1 class="domain">hbtf.ai</h1>
        <p class="subtext">فرصة استثمارية ممتازة لشركات الذكاء الاصطناعي والتكنولوجيا.</p>

        <div class="price-grid">
            <div class="price-card">
                <div class="price-val">10,000</div>
                <div class="price-label">دينار أردني (JOD)</div>
            </div>
            <div class="price-card">
                <div class="price-val">14,100</div>
                <div class="price-label">دولار أمريكي (USD)</div>
            </div>
        </div>

        <div class="details-list">
            <div class="detail-row">
                <div class="detail-lbl"><span>📍</span> الموقع الجغرافي</div>
